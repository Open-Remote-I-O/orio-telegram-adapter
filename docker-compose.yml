# NOTE :Extension field used in order to 
# avoid volume name duplication
# https://docs.docker.com/compose/compose-file/compose-file-v3/#extension-fields
x-orio-root:
  &orio-root
  type: bind
  source: ./
  target: /app

services:
  orio-telegram-adapter:
    # TODO: investigate how to start container without it when using podman as container engine
    privileged: true
    environment:
        DEVICE_CONTROL_PORT: ${DEVICE_CONTROL_PORT}
        DEVICE_CONTROL_PORT: ${DEVICE_CONTROL_PORT}
        # BOT_API_KEY: ${BOT_API_KEY}
    ports:
      - "${LOCAL_DEVICE_CONTROL_PORT}:${DEVICE_CONTROL_PORT}/tcp" 
    expose:
      - "${DEVICE_CONTROL_PORT}"
    build:
      dockerfile: Dockerfile.dev
      context: .
    cap_add:
      NET_ADMIN
      NET_RAW
    volumes:
      - *orio-root
    network:
      - net

  orio-mock-device:
    # TODO: investigate how to start container without it when using podman as container engine
    privileged: true
    restart: on-failure
    environment:
        DEVICE_CONTROL_PORT: ${DEVICE_CONTROL_PORT}
        SERVER_ADDR_NAME: ${SERVER_ADDR_NAME}
    build:
      dockerfile: mock/device/Dockerfile
      context: .
    cap_add:
      NET_ADMIN
      NET_RAW
    volumes:
      - *orio-root
    links: 
      - orio-telegram-adapter
    network:
      - net

networks:
  net:
